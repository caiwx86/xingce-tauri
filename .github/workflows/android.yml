name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # clippy/test 会在 Linux 主机上编译 Tauri 桌面依赖，需要这些系统库
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      # ubuntu-latest 已预装 Android SDK 与 NDK,无需 setup-android
      - name: 配置 NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "ndk;27.0.12077973"
            NDK="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "使用 NDK: $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # tauri-cli 编译很慢，单独缓存二进制；缓存命中时跳过 cargo install
      - name: 缓存 tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: 格式与静态检查
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 生成图标并初始化 Android 工程
        run: |
          cargo tauri icon app-icon.png
          cargo tauri android init --ci

      # 有签名密钥时构建 release 并使用固定密钥签名；没有时退回 debug 构建
      - name: 检查签名密钥
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 Android 签名
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/xingce-upload.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/xingce-upload.jks"
          } > src-tauri/gen/android/keystore.properties
          python3 scripts/configure-android-signing.py

      # Android 工程是 init 之后才生成的，所以缓存步骤放在 init 之后
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建签名 release APK
        if: steps.signing.outputs.enabled == 'true'
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: 构建 debug APK(未配置签名时)
        if: steps.signing.outputs.enabled != 'true'
        run: cargo tauri android build --apk --debug --target aarch64 --ci

      - name: 校验 APK 签名
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: xingce-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          ASSET="xingce-${VERSION}.apk"
          cp "$APK" "$ASSET"
          TAG="v${VERSION}"
          NOTES="行测刷题 ${TAG}

          - 固定签名 release APK，可直接安装
          - 构建运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 首次从旧的 debug 签名包切换时需要先卸载旧包，之后可直接覆盖升级。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "行测刷题 ${TAG}" --notes "$NOTES" --latest
          fi
