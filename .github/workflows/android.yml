name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK 与 NDK,无需 setup-android
      - name: 配置 NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "ndk;27.0.12077973"
            NDK="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "使用 NDK: $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 生成图标并初始化 Android 工程
        run: |
          cargo tauri icon app-icon.png
          cargo tauri android init --ci

      - name: 构建 APK (debug 签名,可直接安装)
        run: cargo tauri android build --apk --debug --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: xingce-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
