[package]
name = "xingce"
version = "0.9.3"
edition = "2021"
rust-version = "1.90"
description = "行测刷题:题库练习、每日挑战、速算训练与错题本"
publish = false

[lib]
name = "xingce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 移动端对体积更敏感:单 codegen unit + LTO + 体积优化 + strip
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
